<!doctype html>

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"

<style>

:root {

    color-scheme: light dark;

    --text:#111111;
    --muted:#5c6770;

    --border:#7593a4;

    --red:#ff3f4d;
    --blue:#1685d1;
    --purple:#a54be0;
    --green:#25bc7b;

    --status-off:#7f9cab;
    --status-on:#24b980;
}


/* ============================================================
   BASIS
============================================================ */

* {
    box-sizing:border-box;
}


html,
body {

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:transparent;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


body {

    color:var(--text);
}



/* ============================================================
   KLEINE VISUALISIERUNG
============================================================ */

.compact {

    width:100%;
    height:100%;

    padding:12px 13px 12px 13px;

    display:flex;
    flex-direction:column;

    background:transparent;

    color:var(--text);
}



/* ============================================================
   KOPF
============================================================ */

.compact-head {

    flex:0 0 auto;

    display:flex;

    justify-content:space-between;
    align-items:flex-start;

    min-height:78px;
}


.compact-head-left {

    min-width:0;
}


.compact-title {

    margin:0;

    font-size:16px;
    line-height:20px;

    font-weight:500;

    white-space:nowrap;
}


.compact-status-line {

    display:flex;

    align-items:center;

    gap:6px;

    margin-top:8px;

    font-size:11px;

    color:var(--muted);
}


.status-dot {

    display:inline-block;

    width:8px;
    height:8px;

    flex:0 0 8px;

    border-radius:50%;

    background:var(--status-off);
}


.status-dot.on {

    background:var(--status-on);
}


.compact-status-title {

    font-weight:700;

    color:#3e474c;
}


.compact-status-value {

    font-weight:400;

    color:var(--muted);
}



/* ============================================================
   AUSSENTEMPERATUR
============================================================ */

.compact-outside {

    text-align:right;

    white-space:nowrap;

    padding-top:21px;
}


.compact-outside-label {

    display:block;

    margin-bottom:2px;

    font-size:10px;
    line-height:12px;

    color:var(--muted);
}


.compact-outside-value {

    display:block;

    font-size:14px;
    line-height:17px;

    font-weight:700;

    color:var(--text);
}



/* ============================================================
   KARTENBEREICH
============================================================ */

.compact-cards {

    flex:1 1 auto;

    min-height:0;

    display:grid;

    grid-template-columns:
        repeat(
            3,
            minmax(0,1fr)
        );

    align-items:center;

    gap:26px;

    padding:
        6px
        8px
        4px
        8px;
}



/* ============================================================
   GEMEINSAME KARTE
============================================================ */

.device-card {

    position:relative;

    width:100%;

    height:147px;

    min-width:0;

    border:
        1.5px solid
        #7897a8;

    border-radius:10px;

    overflow:hidden;

    color:#111111;

    box-shadow:
        inset
        0
        0
        0
        1px
        rgba(255,255,255,0.12);
}


.device-card.wp {

    background:
        linear-gradient(
            180deg,
            #e3ebef 0%,
            #d3e0e7 100%
        );
}


.device-card.boiler,
.device-card.buffer {

    background:
        linear-gradient(
            180deg,
            #dab0b4 0%,
            #d7bbc0 23%,
            #bed0dc 58%,
            #78bae0 100%
        );
}



/* ============================================================
   KARTENTITEL
============================================================ */

.device-title {

    position:absolute;

    left:0;
    right:0;

    top:5px;

    text-align:center;

    font-size:14px;

    font-weight:700;
}



/* ============================================================
   WÄRMEPUMPE
============================================================ */

.wp-symbol {

    position:absolute;

    left:50%;
    top:29px;

    width:46px;
    height:46px;

    transform:
        translateX(-50%);

    border:
        4px solid
        #718b99;

    border-radius:50%;
}


.wp-state {

    position:absolute;

    left:0;
    right:0;

    top:78px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:6px;

    font-size:11px;

    color:#5b6870;
}


.wp-state-dot {

    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--status-off);
}


.wp-state-dot.on {

    background:var(--status-on);
}


.wp-values {

    position:absolute;

    left:13px;
    right:11px;

    bottom:8px;
}


.wp-row {

    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:7px;

    margin-top:4px;

    font-size:12px;
}


.wp-row span {

    color:#5e6970;
}


.wp-row strong {

    white-space:nowrap;

    font-size:13px;

    font-weight:700;
}



/* ============================================================
   BOILER
============================================================ */

.boiler-label-top {

    position:absolute;

    left:10px;
    top:31px;

    font-size:12px;

    color:#626c73;
}


.boiler-value-top {

    position:absolute;

    right:10px;
    top:29px;

    font-size:13px;

    font-weight:700;
}


.boiler-coil {

    position:absolute;

    left:50%;
    top:54px;

    width:76px;
    height:45px;

    transform:
        translateX(-50%);
}


.boiler-coil span {

    position:absolute;

    left:0;

    width:73px;

    height:4px;

    background:#617e8d;

    transform:
        rotate(-6deg);

    transform-origin:center;
}


.boiler-coil span:nth-child(1) {
    top:0;
}


.boiler-coil span:nth-child(2) {
    top:9px;
}


.boiler-coil span:nth-child(3) {
    top:18px;
}


.boiler-coil span:nth-child(4) {
    top:27px;
}


.boiler-coil span:nth-child(5) {
    top:36px;
}


.boiler-label-bottom {

    position:absolute;

    left:10px;
    bottom:12px;

    font-size:12px;

    color:#626c73;
}


.boiler-value-bottom {

    position:absolute;

    right:10px;
    bottom:11px;

    font-size:13px;

    font-weight:700;
}



/* ============================================================
   PUFFER
============================================================ */

.buffer-row {

    position:absolute;

    left:10px;
    right:10px;

    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:7px;

    font-size:12px;
}


.buffer-row span {

    color:#626c73;
}


.buffer-row strong {

    font-size:13px;

    font-weight:700;

    white-space:nowrap;
}


.buffer-row.top {

    top:30px;
}


.buffer-row.middle {

    top:68px;
}


.buffer-row.bottom {

    bottom:12px;
}



/* ============================================================
   HEIZSTAB-SYMBOL
============================================================ */

.heater-indicator {

    position:absolute;

    right:6px;
    bottom:3px;

    width:18px;
    height:15px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:
        2px solid
        #6d8997;

    font-size:10px;

    font-weight:700;

    color:#607982;

    background:
        rgba(244,221,155,0.75);
}


.heater-indicator.on {

    background:#ffdf6a;

    border-color:#c9951c;

    color:#594400;
}



/* ============================================================
   GROSSANSICHT
============================================================ */

.detail {

    display:none;

    width:100%;
    height:100%;

    overflow:auto;

    color:#ffffff;
}


.schema-wrap {

    width:100%;
    height:100%;

    overflow:auto;
}


.schema {

    display:block;

    width:100%;
    height:100%;

    min-width:1000px;
}


.schema text {

    fill:#ffffff;

    stroke:none;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


.schema-bg {

    fill:#071721;
}


.schema-border {

    fill:none;

    stroke:#294554;

    stroke-width:1.5;
}


.component-surface {

    fill:#102838;

    stroke:#7293a5;

    stroke-width:1.5;
}


.tank-surface {

    fill:url(#tankGradient);

    stroke:#7293a5;

    stroke-width:1.5;
}


.schema-title {

    font-size:20px;

    font-weight:700;
}


.schema-main-title {

    font-size:28px;

    font-weight:700;
}


.schema-subtitle {

    font-size:13px;

    fill:#b8c7cf;
}


.schema-label {

    font-size:13px;
}


.schema-value {

    font-size:18px;

    font-weight:700;
}



/* ============================================================
   COMPACT / GROSS UMSCHALTUNG
============================================================ */

/*
 * Normale Kachel = kleine Visu
 * Vergrösserte HTMLBox = Hydraulikschema
 */

@media (min-height:520px) {

    body {

        overflow:auto;

        background:#071721;
    }


    .compact {

        display:none;
    }


    .detail {

        display:block;
    }

}



/* ============================================================
   RESPONSIVE COMPACT
============================================================ */

@media (max-width:520px) {

    .compact {

        padding:
            11px
            10px;
    }


    .compact-cards {

        gap:12px;

        padding-left:0;
        padding-right:0;
    }


    .device-card {

        height:147px;
    }


    .device-title {

        font-size:13px;
    }


    .wp-row {

        font-size:11px;
    }


    .wp-row strong,
    .boiler-value-top,
    .boiler-value-bottom,
    .buffer-row strong {

        font-size:12px;
    }

}

</style>
