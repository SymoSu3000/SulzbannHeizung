<style>

/* ============================================================
   THEME
============================================================ */

:root {

    --text: #17191c;
    --muted: #56616a;

    --border: rgba(80, 105, 118, 0.42);
    --borderStrong: rgba(65, 93, 108, 0.70);

    --yellow: #c38e00;
    --inactive: #78909c;

    --wp-fill: rgba(211, 221, 226, 0.90);

    --tank-top: #d9a7aa;
    --tank-mid: #b9c4d0;
    --tank-bottom: #8ebee0;

    --detail-text: #ffffff;
    --detail-muted: #b8c7cf;

    --red: #ff3f4d;
    --blue: #1685d1;
    --purple: #a54be0;
    --green: #25bc7b;
}


@media (prefers-color-scheme: dark) {

    :root {

        --text: #f2f7fa;
        --muted: #a8bdc9;

        --border: rgba(102, 142, 162, 0.38);
        --borderStrong: rgba(150, 188, 207, 0.72);

        --yellow: #ffc928;
        --inactive: #667d89;

        --wp-fill: rgba(15, 43, 56, 0.88);

        --tank-top: #873743;
        --tank-mid: #424e70;
        --tank-bottom: #145ba2;
    }
}


/* ============================================================
   BASIS
============================================================ */

* {
    box-sizing: border-box;
}


html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: transparent;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color: var(--text);
}


#app {

    width: 100%;
    height: 100%;

    overflow: hidden;
}


/* ============================================================
   KOMPAKTANSICHT
============================================================ */

.compact {

    width: 100%;
    height: 100%;

    margin: 0;

    display: grid;

    grid-template-rows:
        34px
        1fr;

    gap: 2px;

    padding:
        0
        5px
        6px
        5px;
}


.compact-top {

    width: 100%;

    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 10px;

    min-width: 0;

    padding:
        0
        5px;
}


.compact-wp-state {

    display: flex;

    align-items: center;

    gap: 7px;

    min-width: 0;

    flex: 1 1 auto;
}


.status-dot {

    width: 10px;
    height: 10px;

    flex: 0 0 10px;

    border-radius: 50%;

    background: var(--inactive);
}


.status-dot.active {

    background: #25db90;

    box-shadow:
        0 0 8px
        rgba(37, 219, 144, 0.65);
}


.compact-state-main {

    font-size: 13px;
    font-weight: 700;

    line-height: 16px;

    color: var(--text);

    white-space: nowrap;
}


.compact-state-sub {

    margin-left: 3px;

    font-size: 13px;
    font-weight: 400;

    color: var(--muted);
}


.compact-outside {

    flex: 0 0 auto;

    min-width: 70px;

    padding-right: 1px;

    text-align: right;

    white-space: nowrap;
}


.compact-outside-label {

    display: block;

    font-size: 13px;
    line-height: 15px;

    color: var(--muted);
}


.compact-outside-value {

    display: block;

    margin-top: 1px;

    padding-right: 1px;

    font-size: 15px;
    line-height: 17px;

    font-weight: 700;

    color: var(--text);

    white-space: nowrap;
}


.compact-schema-wrap {

    position: relative;

    min-width: 0;
    min-height: 0;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;
}


.compact-schema {

    display: block;

    width: calc(100% + 14px);
    height: calc(100% + 8px);

    max-width: none;
    max-height: none;

    margin-left: -7px;
    margin-right: -7px;
    margin-top: -4px;
    margin-bottom: -4px;
}


.compact-component-box {

    fill: var(--wp-fill);

    stroke: var(--borderStrong);

    stroke-width: 1.5;

    vector-effect: non-scaling-stroke;
}


.compact-tank {

    fill: url(#compactTankGradient);

    stroke: var(--borderStrong);

    stroke-width: 1.6;

    vector-effect: non-scaling-stroke;
}


.compact-svg-title {

    fill: var(--text);

    font-size: 30px;
    font-weight: 700;
}


.compact-svg-label {

    fill: var(--muted);

    font-size: 27px;
    font-weight: 500;
}


.compact-svg-value {

    fill: var(--text);

    font-size: 29px;
    font-weight: 700;
}


.compact-graphic-state {

    font-size: 24px;
    font-weight: 500;
}


.compact-wp-circle {

    fill: none;

    stroke: var(--borderStrong);

    stroke-width: 4;

    vector-effect: non-scaling-stroke;
}


.compact-wp-dot {

    fill: var(--inactive);
}


.compact-wp-dot.active {

    fill: #25db90;

    filter:
        drop-shadow(
            0 0 5px
            rgba(37, 219, 144, 0.65)
        );
}


.compact-heater {

    fill:
        rgba(255, 201, 40, 0.04);

    stroke: #7d7764;

    stroke-width: 2;

    vector-effect: non-scaling-stroke;
}


.compact-heater.active {

    fill:
        rgba(255, 201, 40, 0.16);

    stroke: var(--yellow);

    filter:
        drop-shadow(
            0 0 6px
            rgba(255, 201, 40, 0.7)
        );
}


.compact-heater-letter {

    fill: #716c60;

    font-size: 21px;
    font-weight: 800;
}


.compact-heater-letter.active {

    fill: var(--yellow);
}


/* ============================================================
   GROSSANSICHT
============================================================ */

.detail {

    display: none;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #071721;

    color: var(--detail-text);
}


.schema-wrap {

    width: 100%;
    height: 100%;

    overflow: hidden;

    padding: 8px;
}


.schema {

    display: block;

    width: 100%;
    height: 100%;
}


.schema text {

    fill: var(--detail-text);

    stroke: none;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


.schema-bg {

    fill: #071721;
}


.schema-border {

    fill: none;

    stroke: #294554;

    stroke-width: 1.5;
}


.component-surface {

    fill: #102838;

    stroke: #7293a5;

    stroke-width: 1.5;
}


.tank-surface {

    fill: url(#detailTankGradient);

    stroke: #7293a5;

    stroke-width: 1.5;
}


.schema-title {

    font-size: 20px;
    font-weight: 700;
}


.schema-main-title {

    font-size: 28px;
    font-weight: 700;
}


.schema-subtitle {

    font-size: 13px;

    fill: var(--detail-muted);
}


.schema-label {

    font-size: 13px;
}


.schema-small {

    font-size: 12px;

    fill: var(--detail-muted);
}


.schema-value {

    font-size: 18px;
    font-weight: 700;
}


.schema-value-small {

    font-size: 14px;
    font-weight: 700;
}


.pipe {

    fill: none;

    stroke-linecap: round;
    stroke-linejoin: round;

    vector-effect: non-scaling-stroke;
}


.pipe-red {

    stroke: var(--red);

    stroke-width: 6;
}


.pipe-blue {

    stroke: var(--blue);

    stroke-width: 6;
}


.pipe-purple {

    stroke: var(--purple);

    stroke-width: 5;
}


.pipe-green {

    stroke: var(--green);

    stroke-width: 4;
}


/* ============================================================
   HEIZSTÄBE DETAIL
============================================================ */

.svg-heater {

    fill:
        rgba(255, 201, 40, 0.04);

    stroke: #777162;

    stroke-width: 2;

    vector-effect: non-scaling-stroke;
}


.svg-heater.active {

    fill:
        rgba(255, 201, 40, 0.16);

    stroke: var(--yellow);

    filter:
        drop-shadow(
            0 0 6px
            rgba(255, 201, 40, 0.7)
        );
}


.svg-heater-letter {

    fill: #8c8778;

    font-size: 16px;
    font-weight: 800;
}


.svg-heater-letter.active {

    fill: var(--yellow);
}


/* ============================================================
   KLEIN / GROSS
============================================================ */

@media (min-height: 520px) {

    body {

        overflow: hidden;

        background: #071721;
    }


    .compact {

        display: none;
    }


    .detail {

        display: block;
    }
}


/* ============================================================
   MOBILE
============================================================ */

@media (max-width: 700px) {

    .compact {

        grid-template-rows:
            32px
            1fr;

        padding:
            0
            4px
            5px
            4px;
    }


    .compact-top {

        padding:
            0
            4px;
    }


    .compact-state-main,
    .compact-state-sub,
    .compact-outside-label {

        font-size: 12px;
    }


    .compact-outside-value {

        font-size: 14px;
    }


    .compact-svg-title {

        font-size: 28px;
    }


    .compact-svg-label {

        font-size: 25px;
    }


    .compact-svg-value {

        font-size: 28px;
    }


    .compact-graphic-state {

        font-size: 22px;
    }
}

</style>
