<style>

/* ============================================================
   THEME
============================================================ */

:root {

    --text: #17191c;
    --muted: #56616a;

    --borderStrong: rgba(65, 93, 108, 0.70);

    --yellow: #c38e00;
    --inactive: #78909c;

    --wp-fill: rgba(211, 221, 226, 0.90);

    --tank-top: #d9a7aa;
    --tank-mid: #b9c4d0;
    --tank-bottom: #8ebee0;


    /* DETAIL HELL */

    --detail-bg: #f4f6f7;
    --detail-device: #ffffff;

    --detail-text: #17191c;
    --detail-muted: #58666f;

    --detail-border: #78909c;
    --detail-border-soft: #b5c1c7;

    --detail-tank-top: #d9a7aa;
    --detail-tank-mid: #b9c4d0;
    --detail-tank-bottom: #8ebee0;

    --red: #e33d4a;
    --blue: #1685d1;
    --purple: #8d47bf;
    --green: #25a96e;
}


@media (prefers-color-scheme: dark) {

    :root {

        --text: #f2f7fa;
        --muted: #a8bdc9;

        --borderStrong: rgba(150, 188, 207, 0.72);

        --yellow: #ffc928;
        --inactive: #667d89;

        --wp-fill: rgba(15, 43, 56, 0.88);

        --tank-top: #873743;
        --tank-mid: #424e70;
        --tank-bottom: #145ba2;


        /* DETAIL DUNKEL */

        --detail-bg: #071721;
        --detail-device: #102838;

        --detail-text: #ffffff;
        --detail-muted: #b8c7cf;

        --detail-border: #7293a5;
        --detail-border-soft: #294554;

        --detail-tank-top: #9a4b56;
        --detail-tank-mid: #515d7a;
        --detail-tank-bottom: #236c9d;

        --red: #ff3f4d;
        --blue: #1685d1;
        --purple: #a54be0;
        --green: #25bc7b;
    }
}


/* ============================================================
   BASIS
============================================================ */

* {
    box-sizing: border-box;
}


html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: transparent;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color: var(--text);
}


#app {

    width: 100%;
    height: 100%;

    overflow: hidden;
}


/* ============================================================
   KOMPAKT
============================================================ */

.compact {

    width: 100%;
    height: 100%;

    display: grid;

    grid-template-rows:
        34px
        1fr;

    gap: 2px;

    padding:
        0
        5px
        6px
        5px;
}


.compact-top {

    width: 100%;

    display: flex;

    align-items: center;
    justify-content: space-between;

    padding:
        0
        5px;
}


.compact-wp-state {

    display: flex;

    align-items: center;

    gap: 7px;
}


.status-dot {

    width: 10px;
    height: 10px;

    flex: 0 0 10px;

    border-radius: 50%;

    background: var(--inactive);
}


.status-dot.active {

    background: #25db90;
}


.compact-state-main {

    font-size: 13px;
    font-weight: 700;

    white-space: nowrap;
}


.compact-state-sub {

    margin-left: 3px;

    font-size: 13px;
    font-weight: 400;

    color: var(--muted);
}


.compact-outside {

    min-width: 70px;

    text-align: right;

    white-space: nowrap;
}


.compact-outside-label {

    font-size: 13px;

    color: var(--muted);
}


.compact-outside-value {

    margin-top: 1px;

    font-size: 15px;
    font-weight: 700;
}


.compact-schema-wrap {

    width: 100%;
    height: 100%;

    min-height: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;
}


.compact-schema {

    display: block;

    width: calc(100% + 14px);
    height: calc(100% + 8px);

    margin:
        -4px
        -7px;
}


.compact-component-box {

    fill: var(--wp-fill);

    stroke: var(--borderStrong);

    stroke-width: 1.5;
}


.compact-tank {

    fill: url(#compactTankGradient);

    stroke: var(--borderStrong);

    stroke-width: 1.6;
}


.compact-svg-title {

    fill: var(--text);

    font-size: 30px;
    font-weight: 700;
}


.compact-svg-label {

    fill: var(--muted);

    font-size: 27px;
    font-weight: 500;
}


.compact-svg-value {

    fill: var(--text);

    font-size: 29px;
    font-weight: 700;
}


.compact-graphic-state {

    font-size: 24px;
}


.compact-wp-circle {

    fill: none;

    stroke: var(--borderStrong);

    stroke-width: 4;
}


.compact-wp-dot {

    fill: var(--inactive);
}


.compact-wp-dot.active {

    fill: #25db90;
}


.compact-heater {

    fill: rgba(255, 201, 40, 0.04);

    stroke: #7d7764;

    stroke-width: 2;
}


.compact-heater.active {

    fill: rgba(255, 201, 40, 0.16);

    stroke: var(--yellow);
}


.compact-heater-letter {

    fill: #716c60;

    font-size: 21px;
    font-weight: 800;
}


.compact-heater-letter.active {

    fill: var(--yellow);
}


/* ============================================================
   DETAIL
============================================================ */

.detail {

    display: none;

    width: 100%;
    height: 100%;

    background: var(--detail-bg);

    color: var(--detail-text);
}


.schema-wrap {

    width: 100%;
    height: 100%;

    padding: 8px;

    overflow: hidden;
}


.schema {

    display: block;

    width: 100%;
    height: 100%;
}


.schema text {

    fill: var(--detail-text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


.schema-bg {

    fill: var(--detail-bg);
}


.schema-border {

    fill: none;

    stroke: var(--detail-border-soft);

    stroke-width: 1.5;
}


.component-surface {

    fill: var(--detail-device);

    stroke: var(--detail-border);

    stroke-width: 1.5;
}


.tank-surface {

    fill: url(#detailTankGradient);

    stroke: var(--detail-border);

    stroke-width: 1.5;
}


.schema-main-title {

    font-size: 28px;
    font-weight: 700;
}


.schema-title {

    font-size: 20px;
    font-weight: 700;
}


.schema-subtitle {

    font-size: 13px;

    fill: var(--detail-muted);
}


.schema-label {

    font-size: 13px;
}


.schema-small {

    font-size: 12px;

    fill: var(--detail-muted);
}


.schema-value {

    font-size: 18px;
    font-weight: 700;
}


.schema-value-small {

    font-size: 14px;
    font-weight: 700;
}


.svg-center {

    text-anchor: middle;

    dominant-baseline: middle;
}


/* ============================================================
   ROHRE
============================================================ */

.pipe {

    fill: none;

    stroke-linecap: round;
    stroke-linejoin: round;

    vector-effect: non-scaling-stroke;
}


.pipe-red {

    stroke: var(--red);

    stroke-width: 6;
}


.pipe-blue {

    stroke: var(--blue);

    stroke-width: 6;
}


.pipe-purple {

    stroke: var(--purple);

    stroke-width: 5;
}


.pipe-green {

    stroke: var(--green);

    stroke-width: 4;
}


/* ============================================================
   HEIZSTÄBE
============================================================ */

.svg-heater {

    fill: rgba(255, 201, 40, 0.05);

    stroke: var(--detail-border);

    stroke-width: 2;
}


.svg-heater.active {

    fill: rgba(255, 201, 40, 0.22);

    stroke: var(--yellow);
}


.svg-heater-letter {

    fill: var(--detail-text);

    font-size: 17px;
    font-weight: 800;

    text-anchor: middle;

    dominant-baseline: middle;
}


.svg-heater-letter.active {

    fill: var(--yellow);
}


/* ============================================================
   KLEIN / GROSS
============================================================ */

@media (min-height: 520px) {

    body {
        background: var(--detail-bg);
    }

    .compact {
        display: none;
    }

    .detail {
        display: block;
    }
}

</style>
